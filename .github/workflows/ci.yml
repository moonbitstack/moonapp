name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master
  # Twice a month, so a new toolchain or a dependency's release shows up while nothing is pushed.
  schedule:
    - cron: "43 1 1,16 * *"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      # A window needs a desktop. X11 comes from Xvfb, Wayland from a headless
      # compositor; the other two runners have one already.
      - name: a desktop to open a window on
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb weston

      - name: a window on X11, a frame put on it and read back, and input that reaches it
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            env MOONAPP_BACKEND=x11 MOONAPP_LIVE=1 \
            moon test --target native -p moonbitstack/moonapp/host

      - name: a window on Wayland, and a frame committed to the compositor
        if: runner.os == 'Linux'
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-moonapp \
                 --width=1024 --height=768 >/dev/null 2>&1 &
          weston_pid=$!
          trap 'kill $weston_pid 2>/dev/null' EXIT
          for _ in $(seq 1 60); do
            [ -S "$XDG_RUNTIME_DIR/wayland-moonapp" ] && break
            sleep 0.25
          done
          WAYLAND_DISPLAY=wayland-moonapp MOONAPP_BACKEND=wayland MOONAPP_LIVE=1 \
            moon test --target native -p moonbitstack/moonapp/host

      - name: a window on the desktop, a frame put on it and read back
        if: runner.os != 'Linux'
        env:
          MOONAPP_LIVE: "1"
        run: moon test --target native -p moonbitstack/moonapp/host

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              xvfb-run -a timeout 60 moon run "$dir" --target native > /dev/null
            fi
          done

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skills into a project, so they have
      # to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py
